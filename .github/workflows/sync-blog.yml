name: Sync Naver blog cards

on:
  schedule:
    # Every 3 hours. GitHub may start a scheduled run a few minutes late.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# contents: write lets this job commit the regenerated cards.
# pages: write lets it request a Pages rebuild. This site is deployed from
# the main branch (legacy Pages), and a push made with GITHUB_TOKEN does not
# start the separate pages-build-deployment workflow.
permissions:
  contents: write
  pages: write

concurrency:
  group: sync-naver-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate blog cards from RSS
        run: python3 scripts/sync_blog.py

      - name: Commit and push when the cards changed
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No card changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "글: 네이버 블로그 카드 갱신"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds"
